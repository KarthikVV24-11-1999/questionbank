openapi: 3.1.0
info:
  title: Question Bank — Learning API
  version: 1.0.0
  description: |
    The learner's own Learning surface (M7-52). Every operation names its handler in `x-handler`, which `learning-contract.spec.ts`
    reconciles against the policies the handlers declare.

    **Every route is the caller's own.** The learner is the authenticated principal and appears in no path, query or body, so no route can
    name another learner. An attempt that is not the caller's answers `404`, exactly as one that does not exist: a `403` would confirm it is there.

    **Three handlers have no route**, and the contract spec names each with its reason: the report and the evidence are made by the relay when
    a score lands, and the rule set is published by operations under step-up. Nothing here carries an answer key; the key-free scan of this
    directory covers this document too.
servers:
  - url: https://api.questionbank.example
    description: Production

x-learning-routes:
  - /v1/learning/attempts/{attemptId}/report
  - /v1/learning/attempts/{attemptId}/pace
  - /v1/learning/review-plan
  - /v1/learning/remediation-concepts
  - /v1/learning/concept-map
  - /v1/learning/concept-map/{conceptIdentityId}/evidence
  - /v1/learning/concept-names
  - /v1/learning/error-entries
  - /v1/learning/error-entries/{errorEntryId}/cause
  - /v1/learning/bookmarks

tags:
  - name: learner

paths:
  /v1/learning/attempts/{attemptId}/report:
    get:
      operationId: getDiagnosticReport
      x-handler: GetDiagnosticReport
      summary: The learner's diagnostic report for a scored attempt, findings ranked by marks lost
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: "The learner's diagnostic report for a scored attempt, findings ranked by marks lost."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/learning/attempts/{attemptId}/pace:
    get:
      operationId: getPaceAnalytics
      x-handler: GetPaceAnalytics
      summary: The learner's time against outcome for a scored attempt, with what the interval cap discarded reported as not known
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: "The learner's time against outcome for a scored attempt, with what the interval cap discarded reported as not known."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaceAnalytics' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/learning/review-plan:
    get:
      operationId: getReviewPlan
      x-handler: GetReviewPlan
      summary: What the learner has due for review, and the concepts escalated to remediation
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: "What the learner has due for review, and the concepts escalated to remediation."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/learning/remediation-concepts:
    get:
      operationId: suggestRemediationConcepts
      x-handler: SuggestRemediationConcepts
      summary: The concepts the learner would practise next, weakest first
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: taxonomyVersionId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: "The concepts the learner would practise next, weakest first."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemediationConcepts' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/learning/concept-map:
    get:
      operationId: getConceptMap
      x-handler: GetConceptMap
      summary: What the learner knows, topic by topic, read at this instant
      description: "Decay is applied at the instant of the read, so a state that has gone quiet reads as weaker with nothing scheduled. A state with too few answers behind it is `tentative` and carries no state, only what it leans towards. The declared scope does not filter the map; each topic says whether it is inside it. The answers behind a state are served by the evidence route."
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: "The learner's map."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConceptMap' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/learning/concept-map/{conceptIdentityId}/evidence:
    get:
      operationId: getConceptEvidence
      x-handler: GetConceptEvidence
      summary: The answers a topic's standing is made of, newest first, a page at a time
      tags: [learner]
      parameters:
        - name: conceptIdentityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: "The topic's standing and a page of the answers behind it."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConceptEvidence' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/learning/concept-names:
    get:
      operationId: getConceptNames
      x-handler: GetConceptNames
      summary: What topics are called, and the chapter and subject they sit under
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: taxonomyVersionId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: conceptIdentityIds
          in: query
          required: true
          description: "Comma-separated, at most one hundred."
          schema: { type: string }
      responses:
        '200':
          description: "The names, in the order asked and without repeats."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConceptNames' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/learning/error-entries:
    get:
      operationId: listErrorEntries
      x-handler: ListErrorEntries
      summary: The learner's error notebook
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: openOnly
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: "The learner's entries, one for each response that cost marks or was given up on."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ErrorEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/learning/error-entries/{errorEntryId}/cause:
    put:
      operationId: setErrorCause
      x-handler: SetErrorCause
      summary: Give a wrong response its cause
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: errorEntryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetErrorCauseRequest' }
      responses:
        '200':
          description: The entry with its cause. An entry that is not the caller's is not found.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/learning/bookmarks:
    get:
      operationId: listBookmarks
      x-handler: ListBookmarks
      summary: The learner's bookmarks, each at its item's standing now
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: "Every bookmark; none is dropped for what happened to its item."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ResolvedBookmark' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createBookmark
      x-handler: CreateBookmark
      summary: Bookmark an item
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookmarkRequest' }
      responses:
        '201':
          description: The bookmark.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/learning/profile:
    get:
      operationId: getLearnerProfile
      x-handler: GetLearnerProfile
      summary: The learner's profile and where onboarding stands
      description: "Empty for a learner who has not begun; reading creates nothing. Where the learner was is derived from what the profile holds."
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: "The profile, with the steps of onboarding and the first one still to do."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLearnerProfile
      x-handler: UpdateLearnerProfile
      summary: Take a step of onboarding, or change the profile
      description: "Whatever fields arrive are the step taken; a change with none saves nothing. The exam and year are resolved through Curriculum, and the chapters picked to the concepts they stand for. Any save ends a skip."
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLearnerProfileRequest' }
      responses:
        '200':
          description: The profile as saved.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/learning/profile/skip:
    post:
      operationId: skipOnboarding
      x-handler: SkipOnboarding
      summary: Skip onboarding
      description: "Recorded, and nothing else changes: skipping degrades recommendations and never blocks access. The next thing the learner saves ends it."
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: "The profile as it stands, marked skipped."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/learning/profile/exam-choices:
    get:
      operationId: listExamChoices
      x-handler: ListExamChoices
      summary: The exams a learner may choose, with the years each has a profile for
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The exams and their years.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamChoices' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/learning/profile/scope-options:
    get:
      operationId: getScopeOptions
      x-handler: GetScopeOptions
      summary: The chapters of the syllabus now in force for the learner's exam
      description: "Resolved fresh, so a learner editing after a taxonomy version bump picks from the new version's list. Needs the exam to have been chosen."
      tags: [learner]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: "The chapters, how many concepts the syllabus has, and the ones already picked when the scope declared is for this version."
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeOptions' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string }

  headers:
    CorrelationId:
      description: "Echoed on every response, error or not (§8)."
      schema: { type: string }

  responses:
    Problem:
      description: RFC 9457 Problem Details.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ExamChoice:
      type: object
      required: [examCode, targetYear, examProfileVersionId, taxonomyVersionId]
      properties:
        examCode: { type: string }
        targetYear: { type: string }
        examProfileVersionId:
          type: string
          format: uuid
          description: "The exam profile version the choice resolved to when it was made (INV-04)."
        taxonomyVersionId: { type: string, format: uuid }

    ProfileScope:
      type: object
      required: [status, taxonomyVersionId, nodeIds, conceptCount, conceptTotal, coverageFraction]
      properties:
        status:
          type: string
          enum: [in_force, needs_review, unchecked]
          description: "needs_review means the taxonomy version has moved on since the scope was declared; it filters nothing until it is declared again."
        taxonomyVersionId: { type: string, format: uuid }
        nodeIds:
          type: array
          items: { type: string, format: uuid }
        conceptCount: { type: integer, minimum: 1 }
        conceptTotal: { type: integer, minimum: 1 }
        coverageFraction: { type: number, minimum: 0, maximum: 1 }

    OnboardingState:
      type: object
      required: [steps, next, skipped]
      properties:
        steps:
          type: array
          items:
            type: object
            required: [step, state]
            properties:
              step: { type: string, enum: [exam, class, coverage, prior_score] }
              state: { type: string, enum: [done, pending, optional] }
        next:
          type: [string, 'null']
          enum: [exam, class, coverage, prior_score, null]
          description: "The first step still to do; null when all that is asked has been given. The prior score is optional and never the next step."
        skipped: { type: boolean }

    LearnerProfile:
      type: object
      required: [exam, currentClass, priorScore, scope, onboarding, version]
      properties:
        exam:
          oneOf:
            - { $ref: '#/components/schemas/ExamChoice' }
            - { type: 'null' }
        currentClass: { type: [string, 'null'], enum: [class_11, class_12, repeater, null] }
        priorScore:
          oneOf:
            - type: object
              required: [value, outOf]
              properties:
                value: { type: number }
                outOf: { type: number }
            - { type: 'null' }
        scope:
          oneOf:
            - { $ref: '#/components/schemas/ProfileScope' }
            - { type: 'null' }
        onboarding: { $ref: '#/components/schemas/OnboardingState' }
        version: { type: integer, minimum: 1 }

    UpdateLearnerProfileRequest:
      type: object
      additionalProperties: false
      properties:
        examCode: { type: string }
        targetYear: { type: string, pattern: '^[0-9]{4}(-[0-9]{2})?$' }
        currentClass: { type: string, enum: [class_11, class_12, repeater] }
        priorScore:
          oneOf:
            - type: object
              required: [value, outOf]
              additionalProperties: false
              properties:
                value: { type: number }
                outOf: { type: number }
            - { type: 'null' }
        scopeNodeIds:
          oneOf:
            - type: array
              maxItems: 2000
              items: { type: string, format: uuid }
            - { type: 'null' }

    ExamChoices:
      type: object
      required: [exams]
      properties:
        exams:
          type: array
          items:
            type: object
            required: [examCode, displayName, years]
            properties:
              examCode: { type: string }
              displayName: { type: string }
              years:
                type: array
                items: { type: string }

    ScopeOptions:
      type: object
      required: [taxonomyVersionId, nodes, conceptTotal, selected]
      properties:
        taxonomyVersionId: { type: string, format: uuid }
        conceptTotal: { type: integer, minimum: 1 }
        nodes:
          type: array
          items:
            type: object
            required: [nodeId, parentNodeId, displayName, depth]
            properties:
              nodeId: { type: string, format: uuid }
              parentNodeId: { type: [string, 'null'], format: uuid }
              displayName: { type: string }
              depth: { type: integer, minimum: 0 }
        selected:
          type: array
          items: { type: string, format: uuid }

    Remediation:
      type: object
      required: [strategy, taxonomyVersionId, conceptIdentityId, selected]
      properties:
        strategy: { type: string, enum: [targeted] }
        taxonomyVersionId: { type: string, format: uuid }
        conceptIdentityId: { type: string, format: uuid }
        selected: { type: boolean }

    ReportedFinding:
      type: object
      required: [rank, conceptIdentityId, taxonomyVersionId, marksLost, marksAvailable, slots, skipped, remediation]
      properties:
        rank: { type: integer, minimum: 1, description: 1 is the concept that cost the most. }
        conceptIdentityId: { type: string, format: uuid }
        taxonomyVersionId: { type: string, format: uuid }
        marksLost: { type: string, description: Decimal text. }
        marksAvailable: { type: string, description: Decimal text. }
        slots: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        remediation: { $ref: '#/components/schemas/Remediation' }

    DiagnosticReport:
      type: object
      required: [reportId, attemptId, scoreRecordId, generatedAt, findings]
      properties:
        reportId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        scoreRecordId: { type: string, format: uuid, description: The score record this report is labelled with (D84). After a re-score it can name an earlier record than the one that stands. }
        generatedAt: { type: string, format: date-time }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ReportedFinding' }

    SlotPace:
      type: object
      required: [slotRef, conceptIdentityId, outcome, pace, atLeastMs, atMostMs]
      properties:
        slotRef: { type: string }
        conceptIdentityId: { type: string, format: uuid }
        outcome: { type: string, enum: [correct, incorrect] }
        pace: { type: string, enum: [slow, fast, unknown] }
        atLeastMs: { type: integer, minimum: 0 }
        atMostMs: { type: [integer, 'null'], description: Null where a visit never closed and there is no bound. }

    ConceptPace:
      type: object
      required: [conceptIdentityId, taxonomyVersionId, slowCorrect, slowWrong, fastCorrect, fastWrong, unknownCorrect, unknownWrong]
      properties:
        conceptIdentityId: { type: string, format: uuid }
        taxonomyVersionId: { type: string, format: uuid }
        slowCorrect: { type: integer, minimum: 0 }
        slowWrong: { type: integer, minimum: 0 }
        fastCorrect: { type: integer, minimum: 0 }
        fastWrong: { type: integer, minimum: 0 }
        unknownCorrect: { type: integer, minimum: 0 }
        unknownWrong: { type: integer, minimum: 0 }

    PaceAnalytics:
      type: object
      required: [attemptId, slots, concepts, ruleSets]
      properties:
        attemptId: { type: string, format: uuid }
        slots:
          type: array
          items: { $ref: '#/components/schemas/SlotPace' }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/ConceptPace' }
        ruleSets:
          type: array
          items:
            type: object
            required: [taxonomyVersionId, ruleSetId, thresholdsHash]
            properties:
              taxonomyVersionId: { type: string, format: uuid }
              ruleSetId: { type: string }
              thresholdsHash: { type: string }

    ScheduledConcept:
      type: object
      required: [taxonomyVersionId, conceptIdentityId, dueAt, intervalDays, consecutiveSuccesses, lapseCount, lastObservedAt]
      properties:
        taxonomyVersionId: { type: string, format: uuid }
        conceptIdentityId: { type: string, format: uuid }
        dueAt: { type: string, format: date-time }
        intervalDays: { type: number }
        consecutiveSuccesses: { type: integer, minimum: 0 }
        lapseCount: { type: integer, minimum: 0 }
        lastObservedAt: { type: string, format: date-time }

    EscalationFinding:
      type: object
      required: [taxonomyVersionId, conceptIdentityId, lapseCount, escalatedAt, remediation]
      properties:
        taxonomyVersionId: { type: string, format: uuid }
        conceptIdentityId: { type: string, format: uuid }
        lapseCount: { type: integer, minimum: 0 }
        escalatedAt: { type: string, format: date-time }
        remediation: { $ref: '#/components/schemas/Remediation' }

    ReviewPlan:
      type: object
      required: [asOf, due, escalated]
      properties:
        asOf: { type: string, format: date-time }
        due:
          type: array
          description: Most overdue first.
          items: { $ref: '#/components/schemas/ScheduledConcept' }
        escalated:
          type: array
          items: { $ref: '#/components/schemas/EscalationFinding' }

    RemediationConcepts:
      type: object
      required: [conceptIdentityIds]
      properties:
        conceptIdentityIds:
          type: array
          items: { type: string, format: uuid }

    NamedConcept:
      type: object
      required: [conceptIdentityId, name, path]
      properties:
        conceptIdentityId: { type: string, format: uuid }
        name: { type: string }
        path:
          type: array
          description: "The names above it, outermost first: subject, chapter, topic."
          items: { type: string }

    ConceptNames:
      type: object
      required: [concepts]
      properties:
        concepts:
          type: array
          items: { $ref: '#/components/schemas/NamedConcept' }

    Standing:
      description: "Asserted when enough answers stand behind it; tentative when they do not, and then it names what the answers lean towards and no state."
      oneOf:
        - type: object
          required: [kind, state, confidence]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [asserted] }
            state: { type: string, enum: [weak, developing, strong] }
            confidence: { type: number, minimum: 0, maximum: 1 }
        - type: object
          required: [kind, leaning]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [tentative] }
            leaning: { type: string, enum: [weak, developing, strong] }
        - type: object
          required: [kind]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [unassessed] }

    MappedConcept:
      type: object
      required: [conceptIdentityId, name, path, standing, evidenceCount, lastEvidenceAt, inDeclaredScope]
      properties:
        conceptIdentityId: { type: string, format: uuid }
        name: { type: string }
        path:
          type: array
          items: { type: string }
        standing: { $ref: '#/components/schemas/Standing' }
        evidenceCount: { type: integer, minimum: 0 }
        lastEvidenceAt: { type: [string, 'null'], format: date-time }
        inDeclaredScope: { type: [boolean, 'null'] }

    ConceptMap:
      type: object
      required: [asOf, concepts, assessedCount, unassessedCount]
      properties:
        asOf: { type: string, format: date-time }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/MappedConcept' }
        assessedCount: { type: integer, minimum: 0 }
        unassessedCount: { type: integer, minimum: 0 }

    ConceptResponse:
      type: object
      required: [evidenceId, attemptRef, occurredAt, outcome, difficultyEstimate]
      properties:
        evidenceId: { type: string, format: uuid }
        attemptRef: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        outcome: { type: string, enum: [correct, incorrect] }
        difficultyEstimate: { type: string, enum: [foundational, moderate, challenging, advanced] }

    ConceptEvidence:
      type: object
      required: [concept, standing, evidenceCount, lastEvidenceAt, asOf, responses, total, limit, offset]
      properties:
        concept: { $ref: '#/components/schemas/NamedConcept' }
        standing: { $ref: '#/components/schemas/Standing' }
        evidenceCount: { type: integer, minimum: 0 }
        lastEvidenceAt: { type: [string, 'null'], format: date-time }
        asOf: { type: string, format: date-time }
        responses:
          type: array
          items: { $ref: '#/components/schemas/ConceptResponse' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }

    ErrorEntry:
      type: object
      required: [errorEntryId, learnerRef, attemptRef, slotRef, itemVersionRef, conceptIdentityId, taxonomyVersionId, kind, errorCause, occurredAt, resolvedByTransitionId]
      properties:
        errorEntryId: { type: string, format: uuid }
        learnerRef: { type: string }
        attemptRef: { type: string, format: uuid }
        slotRef: { type: string }
        itemVersionRef: { type: string, format: uuid }
        conceptIdentityId: { type: string, format: uuid }
        taxonomyVersionId: { type: string, format: uuid }
        kind: { type: string, enum: [incorrect, gave_up] }
        errorCause: { type: [string, 'null'], enum: [conceptual, calculation, misread, time, guess, gave_up, null] }
        occurredAt: { type: string, format: date-time }
        resolvedByTransitionId: { type: [string, 'null'] }

    SetErrorCauseRequest:
      type: object
      required: [cause]
      properties:
        cause: { type: string, enum: [conceptual, calculation, misread, time, guess] }

    Bookmark:
      type: object
      required: [bookmarkId, learnerRef, itemId, createdAt]
      properties:
        bookmarkId: { type: string, format: uuid }
        learnerRef: { type: string }
        itemId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    ResolvedBookmark:
      type: object
      required: [bookmarkId, learnerRef, itemId, createdAt, state, itemVersionId]
      properties:
        bookmarkId: { type: string, format: uuid }
        learnerRef: { type: string }
        itemId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        state: { type: string, enum: [published, suspended, retired, unknown] }
        itemVersionId: { type: [string, 'null'], format: uuid }

    CreateBookmarkRequest:
      type: object
      required: [itemId]
      properties:
        itemId: { type: string, format: uuid }

    ProblemDetails:
      type: object
      required: [type, title, status, detail, code, retryable, correlationId, reason]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        retryable: { type: boolean }
        correlationId: { type: string }
        reason: { type: string }
