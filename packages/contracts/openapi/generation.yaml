openapi: 3.1.0
info:
  title: Question Bank — Generation API
  version: 1.0.0
  description: |
    The generation context's HTTP contract (BACKEND-ARCHITECTURE §3). Every
    operation names its handler in `x-handler`, which the contract spec reconciles
    against the registry.

    **An operator starts a run, reads what it produced, and may override what became
    of a candidate.** No route here is student-facing, and none reaches a model:
    proposing a candidate and running the pre-check battery call a provider, so they
    are the pipeline's work and have no route (F33). The pipeline accepts a candidate
    whose blocking checks all passed and rejects one that failed a blocking check,
    without a person (ADR-0029); `acceptance` and `rejection` below are the
    operator's manual override of that, not the path candidates normally take.

    **Every route here is an authoring-family route (ADR-0009, ADR-0028).** A
    candidate carries a proposed item, and a proposed item carries its answer key,
    so a read of one is an authoring read and is `content_ops` only. The family is
    enumerated and closed in `x-authoring-routes` below, and the contract spec
    asserts the list against the document in both directions — a new path that is
    not on the list fails, and a listed path that stops existing fails too. No other
    document in this repository may declare a `/v1/authoring/` path.
servers:
  - url: https://api.questionbank.example
    description: Production

# The enumerated, closed authoring route list (ADR-0009 condition 1, extended to this document by ADR-0028).
x-authoring-routes:
  - /v1/authoring/generation-runs
  - /v1/authoring/generation-runs/{runId}/candidates
  - /v1/authoring/generation-candidates/{candidateId}
  - /v1/authoring/generation-candidates/{candidateId}/acceptance
  - /v1/authoring/generation-candidates/{candidateId}/rejection

tags:
  - name: generation-runs
  - name: generation-candidates

paths:
  /v1/authoring/generation-runs:
    post:
      operationId: startGenerationRun
      x-handler: StartGenerationRun
      summary: Start a generation run, pinning the model and prompt it will execute under
      tags: [generation-runs]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartGenerationRunRequest' }
      responses:
        '201':
          description: The run was recorded. Its pin is immutable from this moment.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/authoring/generation-runs/{runId}/candidates:
    get:
      operationId: listRunCandidates
      x-handler: ListRunCandidates
      summary: The run's candidates that a person still has something to decide about
      description: |
        A candidate that failed a blocking pre-check can never be accepted and is
        not listed; it stays readable by id with its failing verdicts (M5-39). A
        candidate that failed only an advisory check, or has not been checked,
        is listed.
      tags: [generation-candidates]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The run's candidates not excluded above, each with the battery's working beside it.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GenerationCandidate' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/authoring/generation-candidates/{candidateId}:
    get:
      operationId: getCandidate
      x-handler: GetCandidate
      summary: One candidate, with its proposal and every verdict recorded against it
      tags: [generation-candidates]
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The candidate.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationCandidate' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/authoring/generation-candidates/{candidateId}/acceptance:
    post:
      operationId: acceptCandidate
      x-handler: AcceptCandidate
      summary: Accept a candidate by hand, creating a draft in the review queue
      description: |
        The operator's override. The preconditions are the pipeline's: a candidate
        that failed a blocking check, or has not passed every one, is refused. What
        this creates is a draft awaiting a reviewer — nothing is published.
      tags: [generation-candidates]
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The candidate was accepted; the draft it became is named.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedCandidate' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/authoring/generation-candidates/{candidateId}/rejection:
    post:
      operationId: rejectCandidate
      x-handler: RejectCandidate
      summary: Reject a candidate by hand. Terminal.
      tags: [generation-candidates]
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The candidate is rejected.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationCandidate' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string }

  headers:
    CorrelationId:
      description: Echoed on every response, error or not (§8).
      schema: { type: string }

  responses:
    Problem:
      description: RFC 9457 Problem Details.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ErrorCode:
      type: string
      enum:
        [
          Validation,
          Authentication,
          Authorization,
          Entitlement,
          NotFound,
          Conflict,
          PreconditionFailed,
          RuleViolation,
          RateLimited,
          Unavailable,
        ]

    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code, retryable, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        retryable:
          type: boolean
          description: Explicit on every error. Clients must not infer it (§8).
        correlationId: { type: string }

    StartGenerationRunRequest:
      type: object
      additionalProperties: false
      required: [modelVersionId, promptVersionId, request, budgetTokens]
      properties:
        modelVersionId:
          type: string
          format: uuid
          description: A model version row in the registry. Pinned data, never a configuration constant.
        promptVersionId:
          type: string
          format: uuid
          description: A prompt version row in the registry.
        request:
          type: object
          description: What was asked for. Its shape is the pipeline's to define.
        budgetTokens:
          type: integer
          minimum: 1
          description: |
            What the run reserves from its UTC month's budget, in tokens. Refused at enqueue,
            with nothing written, when the month has no declared budget or this would take
            the reservations past its ceiling (412 PreconditionFailed).

    ModelPin:
      type: object
      additionalProperties: false
      required: [modelVersionId, promptVersionId, runId]
      description: |
        The three registry references every generated artifact carries (F28), so
        "which items did prompt v7 produce?" is one query. System-supplied: a
        request can name the model and prompt, never the run.
      properties:
        modelVersionId: { type: string, format: uuid }
        promptVersionId: { type: string, format: uuid }
        runId: { type: string, format: uuid }

    GenerationRun:
      type: object
      additionalProperties: false
      required: [pin, requestedAt, request, budgetTokens]
      properties:
        pin: { $ref: '#/components/schemas/ModelPin' }
        requestedAt:
          type: string
          format: date-time
          description: Supplied by the system's clock, never by the caller.
        request: { type: object }
        budgetTokens: { type: integer, minimum: 1 }

    CandidateState:
      type: string
      enum: [proposed, accepted, rejected]

    VerdictOutcome:
      type: string
      enum: [pass, fail]

    PrecheckId:
      type: string
      enum:
        - schema_validity
        - renderability
        - answer_verification
        - numeric_spec_completeness
        - syllabus_scope
        - item_solution_key_consistency
        - distractor_validity
        - duplicate_detection
        - difficulty_plausibility
        - ambiguity_clarity
        - safety_appropriateness
        - provenance_licensing_completeness

    PrecheckVerdict:
      type: object
      additionalProperties: false
      required: [check, outcome]
      description: A check that did not run has no verdict. It is not a pass.
      properties:
        check: { $ref: '#/components/schemas/PrecheckId' }
        outcome: { $ref: '#/components/schemas/VerdictOutcome' }
        detail:
          type: string
          description: The check's working, so a reviewer sees why and not only what.

    ProposedContent:
      type: object
      additionalProperties: false
      required: [itemType, body]
      properties:
        itemType: { type: string }
        body:
          type: object
          description: |
            The proposal as content's authoring document. It carries the proposed
            item's answer key, which is why every route returning it is an
            authoring route.

    GenerationCandidate:
      type: object
      additionalProperties: false
      required: [candidateId, pin, content, verdicts, confidence, state]
      properties:
        candidateId: { type: string, format: uuid }
        pin: { $ref: '#/components/schemas/ModelPin' }
        content: { $ref: '#/components/schemas/ProposedContent' }
        verdicts:
          type: array
          items: { $ref: '#/components/schemas/PrecheckVerdict' }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: How sure the model was. Content's AI provenance requires it.
        state: { $ref: '#/components/schemas/CandidateState' }

    AcceptedCandidate:
      type: object
      additionalProperties: false
      required: [candidateId, contentItemId]
      properties:
        candidateId: { type: string, format: uuid }
        contentItemId:
          type: string
          format: uuid
          description: The content draft the candidate became — an identifier, not a join.
