<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question Bank</title>
    <style>
      /* WCAG 2.2 2.5.8 (AA): a control is at least 24 by 24 CSS pixels. 44 is what a thumb on a phone needs, and what a student sitting a paper on one is using. */
      button,
      select,
      input:not([type='checkbox']):not([type='radio']) {
        min-height: 44px;
        min-width: 44px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
