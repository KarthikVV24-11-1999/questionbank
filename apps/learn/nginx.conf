# Serves the learner app and puts the API behind the same address (M8-38): the app calls the API at the origin it was loaded from, so there is one address and no cross-origin request.
#
# What this server must not do, because the app depends on it:
#   - cache the service worker or the page. The worker is served from the root, so its scope is the whole app, with a header that has the browser ask again every time; a stale worker
#     keeps serving a stale shell for as long as the browser holds it.
#   - touch a signed package. A package's bytes are verified against a digest and a signature, and the digest is also its ETag. Compression changes the bytes and weakens the ETag, so it is off,
#     and the proxy passes the body, the media type and the validators through as the API sent them.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  gzip off;

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files /sw.js =404;
  }

  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
