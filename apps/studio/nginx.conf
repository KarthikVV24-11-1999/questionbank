# Serves Studio and puts the API behind the same address, as the learner app's does. Studio has no service worker and no signed package, so there is less to protect: the page is not cached,
# and the assets are named by their content.
server {
  listen 4173;
  server_name _;
  root /usr/share/nginx/html;
  gzip off;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
