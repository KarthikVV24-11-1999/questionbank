# JEE Main 2026 exam profile — the v1 exam configuration, entirely as data.
#
# 3 sections of 25 items (20 single-correct MCQ + 5 numeric), 300 marks,
# a single 180-minute timer, no sectional locking, free navigation.
# Marking is the three-rule JEE Main set from ASSESSMENT-ENGINE §2.4.
schemaVersion: 1

exam:
  code: JEE_MAIN
  displayName: 'JEE Main'
  jurisdiction: IN
  conductingBody: 'National Testing Agency'

academicYear: '2026'
taxonomyFamily: JEE
totalMarks: 300

sections:
  - ordinal: 1
    name: Physics
    subject: physics
    itemCount: 25
    itemTypeMix:
      SINGLE_CORRECT_MCQ: 20
      NUMERIC: 5
    maxMarks: 100
  - ordinal: 2
    name: Chemistry
    subject: chemistry
    itemCount: 25
    itemTypeMix:
      SINGLE_CORRECT_MCQ: 20
      NUMERIC: 5
    maxMarks: 100
  - ordinal: 3
    name: Mathematics
    subject: mathematics
    itemCount: 25
    itemTypeMix:
      SINGLE_CORRECT_MCQ: 20
      NUMERIC: 5
    maxMarks: 100

timingPolicy:
  totalDurationMinutes: 180
  sectionLocking: false
  warningThresholdsMinutes: [30, 10, 5]
  autoSubmitOnExpiry: true

navigationPolicy:
  crossSectionNavigation: true
  allowMarkForReview: true
  allowAnswerChange: true
  allowClearResponse: true

# The three authored rules from ASSESSMENT-ENGINE §2.4 plus the terminal
# ALWAYS that F46 requires. The terminal rule awards 0, never a penalty: a
# response state the authors did not anticipate must not cost a candidate a
# mark. The JEE Advanced set in §2.4 terminates the same way.
markingRuleSet:
  schemaVersion: 1
  rules:
    - id: unattempted
      appliesTo:
        itemTypes: [SINGLE_CORRECT_MCQ, NUMERIC]
      condition:
        kind: UNATTEMPTED
      award:
        kind: FIXED
        marks: 0
    - id: correct
      appliesTo:
        itemTypes: [SINGLE_CORRECT_MCQ, NUMERIC]
      condition:
        kind: EXACT_MATCH
      award:
        kind: FIXED
        marks: 4
    - id: incorrect
      appliesTo:
        itemTypes: [SINGLE_CORRECT_MCQ, NUMERIC]
      condition:
        kind: NO_MATCH
      award:
        kind: FIXED
        marks: -1
    - id: default
      appliesTo:
        itemTypes: [SINGLE_CORRECT_MCQ, NUMERIC]
      condition:
        kind: ALWAYS
      award:
        kind: FIXED
        marks: 0

# Numeric answers are compared with an absolute tolerance by default (D-001
# rule 2); an item may override it.
toleranceDefault:
  expectedValue: '0'
  comparisonMode: ABSOLUTE_TOLERANCE
  toleranceValue: '0.01'
  acceptedForms: [DECIMAL, SCIENTIFIC]

itemTypeAllowances:
  - itemType: SINGLE_CORRECT_MCQ
    sectionOrdinals: [1, 2, 3]
  - itemType: NUMERIC
    sectionOrdinals: [1, 2, 3]
