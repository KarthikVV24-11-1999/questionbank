# NEET UG 2026 taxonomy — the syllabus subjects NEET examines.
#
# Physics and Chemistry mirror the JEE chapter structure; Biology is NEET's own.
# Present because a profile must reference a published taxonomy version of its
# own family; the concepts themselves are the NCERT syllabus headings.
#
