name: CI

# DEC-M0-3: this file is a thin caller and contains zero assertions of its
# own. Every gate lives in apps/api/src/fitness/, run here by name; what this
# workflow's own shape must be true is asserted by ci-rules.spec.ts, which
# parses this file. That parse was the only evidence for five milestones;
# the workflow is now executed by GitHub Actions as well (Tier 1, ADR-0023).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm -r typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @questionbank/api exec vitest run --project unit
      - run: corepack pnpm --filter @questionbank/studio test
      - run: corepack pnpm --filter @questionbank/learn test
      - run: corepack pnpm --filter @questionbank/contracts test
      - run: corepack pnpm --filter @questionbank/content-renderer test
      - run: corepack pnpm --filter @questionbank/domain-types test
      - run: corepack pnpm --filter @questionbank/attempt-engine test

  adversarial:
    # A real Chrome (the runner has one) is started, killed and restarted against the built learner app: see tools/adversarial/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: google-chrome --version
      - run: corepack pnpm --filter @questionbank/adversarial test
      # A run that times out leaves its console, network log and screenshot here (D80); the step runs after a failure, which is the only time there is anything.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adversarial-failures
          path: tools/adversarial/failures/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: questionbank_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/questionbank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: '@questionbank/api — unit and integration, with the coverage thresholds'
        run: corepack pnpm --filter @questionbank/api test
      - name: '@questionbank/seed'
        run: corepack pnpm --filter @questionbank/seed test

  fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @questionbank/api fitness

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @questionbank/studio build
      - run: corepack pnpm --filter @questionbank/learn build
