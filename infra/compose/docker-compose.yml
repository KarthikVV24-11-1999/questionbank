name: questionbank

# Local and staging Compose for TECH-STACK §14 (M0-20, M8-38, M8-39).
#
# Tier 1 (ADR-0013, ADR-0023) since M8 Track I, and no longer Tier 2: the `compose` job in .github/workflows/ci.yml builds the images, brings this stack up with `--wait`, applies the migrations,
# loads the seed, and runs the journey from sign-up to a first named weakness against it over HTTP. That job's exit code is the claim, and F8 in docs/ARCHITECTURE.md
# carries the time it measured and the run it came from. `compose-rules.spec.ts` still asserts the properties of this file by parsing it, which is a different and weaker thing.
# No boot time is claimed anywhere in this repository that a run of that job did not measure.
#
#   docker compose -f infra/compose/docker-compose.yml build
#   docker compose -f infra/compose/docker-compose.yml up -d --wait postgres
#   docker compose -f infra/compose/docker-compose.yml run --rm --no-deps api node migrate.js
#   docker compose -f infra/compose/docker-compose.yml up -d --wait
#   DATABASE_URL=postgres://postgres:$QB_DB_PASSWORD@localhost:5432/questionbank pnpm seed && pnpm --filter @questionbank/seed run seed:items
#
# The secrets are references and are supplied by whoever runs the stack: AUTH_SIGNING_KEY, AUDIT_ANCHOR_KEY and FORM_PACKAGE_SIGNING_KEY, each 32 random bytes, base64 (`openssl rand -base64 32`),
# and the three different. Nothing here holds one.
#
# NODE_ENV is `development`, and a green boot of this file is not evidence that mail works. With none of the four mail settings below a development process writes each message to a file
# (QB_MAIL_DIR, a directory or, by default, a volume), which is what lets the journey read its own verification link, and that is what the CI boot does; with all four it sends through Amazon
# SES (M8-41), which this file's CI run never exercises: no run of it holds an AWS credential, so it would pass with SES entirely broken. The first message sent through SES is a step the owner
# runs on the host (`mail-smoke`, docs/DEPLOYMENT.md). The stack is for a person on a machine or a staging VM, not for the public.
#
# There is no `ai-fixture` service. It was a local stand-in for an AI provider and nothing in the application or the beta path calls one (the generation pipeline runs against its own
# fixtures in tests), so the service, its build context and the API's dependency on it were removed rather than a fixture written for a dependency nobody has. `valkey` and `minio` are
# the same: the application uses neither (no cache or queue; media is a directory), so they are kept for parity with TECH-STACK §14 under the `parity` profile and are not started by default.

# Which ports are published, and to whom (D123). The database, the API, Studio and minio publish on 127.0.0.1 only: the seed commands, the CI journeys and a person on the host reach them on
# `localhost`, and nothing from outside the host can, whatever its firewall says. The learner app's 8080 is the one meant to be reached (by the TLS proxy on the same host), so it publishes
# on every interface. `compose-rules.ts` fails the `fitness` job if one of the four is published any wider. The database also asks for a password, QB_DB_PASSWORD, a reference like the
# keys: it takes effect when the volume is first made, so a volume made under the old `trust` setting keeps accepting anyone until it is removed (`down -v`) or its role is given a password.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: questionbank
      POSTGRES_PASSWORD: ${QB_DB_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:8.0
    profiles: ['parity']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    profiles: ['parity']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: questionbank
      MINIO_ROOT_PASSWORD: questionbank-local
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgres://postgres:${QB_DB_PASSWORD}@postgres:5432/questionbank
      # development, and it has to be: a production process does not start, because the only media store refuses it (D32, D124). Mail is a file unless the four settings below are given.
      NODE_ENV: development
      PORT: '3000'
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY}
      AUDIT_ANCHOR_KEY: ${AUDIT_ANCHOR_KEY}
      FORM_PACKAGE_SIGNING_KEY: ${FORM_PACKAGE_SIGNING_KEY}
      AUTH_ISSUER: questionbank
      AUTH_TOKEN_TTL_SECONDS: '3600'
      MEDIA_STORAGE_ROOT: /var/media/files
      LOG_LEVEL: info
      # the learner app and Studio reach this process through a proxy that sets X-Forwarded-For, so the rate limits count the learner's address and not the proxy's
      # one proxy (the learner app's nginx); a TLS proxy in front of that makes it 2
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # where the learner app is reached, so the link in a message opens it; the port is the learner service's, below
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # mail through SES when all four are set, and none otherwise (the process refuses to start on some). References, never values: blank here means not set.
      MAIL_SES_REGION: ${MAIL_SES_REGION:-}
      MAIL_SENDER: ${MAIL_SENDER:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ${QB_MAIL_DIR:-qb-mail}:/var/media/mail
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:3000/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # the healthchecks of the two nginx services name 127.0.0.1 and not localhost: nginx here listens on IPv4 only, and `localhost` in the image resolves to ::1 first
  learn:
    build:
      context: ../..
      dockerfile: apps/learn/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  studio:
    build:
      context: ../..
      dockerfile: apps/studio/Dockerfile
    ports:
      - '127.0.0.1:4173:4173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:4173/']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  qb-mail:
