      - alert: MetricsAbsent
        expr: "absent(qb_http_requests_total) or absent(qb_outbox_depth)"
        for: 5m
        labels:
          severity: "page"
          slo: "availability"
        annotations:
          summary: "The API's metrics are not being scraped, so none of the burn alerts can fire"
          description: "Either the scraper cannot reach the API on 127.0.0.1:3000/metrics or the API is down."
          runbook: "docs/DEPLOYMENT.md#watching-it"
