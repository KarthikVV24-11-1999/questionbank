      - alert: SloBurn_relay_freshness_1h
        expr: "(1 - avg_over_time((qb_outbox_oldest_unrelayed_age_seconds < bool 60)[1h:1m])) > 0.144 and (1 - avg_over_time((qb_outbox_oldest_unrelayed_age_seconds < bool 60)[5m:1m])) > 0.144"
        for: 2m
        labels:
