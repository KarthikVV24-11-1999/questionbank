          description: "Objective 99% over 28d (budget 1%); this rate spends 2% of the 28-day budget in an hour. PER-13 asks for a result within 60 s of submission. The API does not time that end to end; the age of the oldest message the relay has not delivered is the part of it that can queue, and it is a gauge, so it is averaged over the window and not rated."
          runbook: "docs/DEPLOYMENT.md#watching-it"
