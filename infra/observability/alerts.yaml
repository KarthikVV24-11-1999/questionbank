# GENERATED by tools/observability/render-alerts.mjs from infra/observability/slo.json. Do not edit; change the objectives and render again (`--check` fails if they differ).
# Tier 2 (ADR-0013): these objectives and the alert rules generated from them are parsed and asserted by apps/api/src/fitness/observability-rules.spec.ts. No alert has fired, nothing evaluates them, and nothing pages anyone (D132).
# Not loaded by anything, evaluated by nothing, and the receiver of a page does not exist.
groups:
  - name: questionbank-slo-burn
    rules:
      - alert: SloBurn_availability_1h
        expr: "(sum(rate(qb_http_requests_total{status_class=\"5xx\"}[1h])) / sum(rate(qb_http_requests_total[1h]))) > 0.072 and (sum(rate(qb_http_requests_total{status_class=\"5xx\"}[5m])) / sum(rate(qb_http_requests_total[5m]))) > 0.072"
        for: 2m
        labels:
          severity: "page"
          slo: "availability"
        annotations:
          summary: "Requests are answered without a server error: the error budget is burning 14.4x too fast over 1h (and over 5m)"
          description: "Objective 99.5% over 28d (budget 0.5%); this rate spends 2% of the 28-day budget in an hour. The beta's own figure, not the NFR's: 99.5% over 28 days is about 3.4 hours of 5xx, which two hundred students tolerate and which a single host with no standby can keep."
          runbook: "docs/DEPLOYMENT.md#watching-it"
      - alert: SloBurn_availability_6h
        expr: "(sum(rate(qb_http_requests_total{status_class=\"5xx\"}[6h])) / sum(rate(qb_http_requests_total[6h]))) > 0.03 and (sum(rate(qb_http_requests_total{status_class=\"5xx\"}[30m])) / sum(rate(qb_http_requests_total[30m]))) > 0.03"
