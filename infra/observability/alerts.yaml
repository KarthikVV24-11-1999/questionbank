        for: 2m
        labels:
          severity: "page"
          slo: "probe"
        annotations:
          summary: "The synthetic probe signs in and reads: the error budget is burning 14.4x too fast over 1h (and over 5m)"
          description: "Objective 99% over 28d (budget 1%); this rate spends 2% of the 28-day budget in an hour. The probe (tools/stack-journey/probe.mjs) is the one check made from outside, through the proxy; the others are the API's account of itself. A host that cannot be reached answers none of them."
