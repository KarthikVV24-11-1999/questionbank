          description: "Objective 95% over 28d (budget 5%); this rate spends 2% of the 28-day budget in an hour. PER-08's target is a p95, so the objective is that 95% of reads are under it."
          runbook: "docs/DEPLOYMENT.md#watching-it"
      - alert: SloBurn_read_latency_6h
